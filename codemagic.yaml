# Codemagic CI/CD — Loveyaniask
# NOT: Bu dosya reponun KÖKÜNDE olmalı (Codemagic burada arar).
#
# Native iOS (Xcode projesi, Flutter değil). Bağımlılıklar SPM ile geliyor.
#
# Codemagic UI'da bir kez ayarlanacaklar:
#   Environment variables → grup adı "loveyaniask", ikisi de Secure:
#     CERTIFICATE_PRIVATE_KEY  → hesap geneli Apple Distribution private key'i
#                                (bkz. "ÖNEMLİ — Codemagic iOS İmzalama Anahtarı" notu)
#     MAPBOX_DOWNLOADS_TOKEN   → sk. ile başlayan Mapbox indirme token'ı
#
# İMZALAMA UYARISI: Apple en fazla 2 dağıtım sertifikasına izin veriyor ve
# slotlar DOLU. Bu yüzden Codemagic'in otomatik imzalamasını (ios_signing bloğu)
# KULLANMIYORUZ — o yeni sertifika üretmeye çalışır. Bunun yerine mevcut
# private key veriliyor, fetch-signing-files sadece bu bundle id için yeni
# PROFİL oluşturuyor. Aynı yöntem "para" projesinde çalışıyor.

workflows:
  ios-testflight:
    name: Loveyaniask iOS (TestFlight)
    instance_type: mac_mini_m2
    max_build_duration: 90

    integrations:
      app_store_connect: Codemagic Admin

    environment:
      groups:
        - loveyaniask
      xcode: latest
      vars:
        BUNDLE_ID: "com.loveyaniask.Loveyaniask"
        XCODE_PROJECT: "Loveyaniask.xcodeproj"
        XCODE_SCHEME: "Loveyaniask"
        # TestFlight'taki son build numarası. İlk CI build'i bunun bir fazlası
        # olur (11), sonrası 12, 13... Böylece mevcut build'lerle çakışmaz.
        BUILD_NUMBER_OFFSET: 10

    triggering:
      events:
        - push
      branch_patterns:
        - pattern: main
          include: true
          source: true
      cancel_previous_builds: true

    scripts:
      - name: Mapbox indirme token'ı
        script: |
          set -e
          # MapboxMaps paketi ikili dosyalarını çekerken .netrc arıyor.
          # Bu olmadan build, bağımlılık çözme aşamasında ölür.
          cat > "$HOME/.netrc" <<EOF
          machine api.mapbox.com
          login mapbox
          password $MAPBOX_DOWNLOADS_TOKEN
          EOF
          chmod 600 "$HOME/.netrc"

      - name: Build numarasını ayarla
        script: |
          set -e
          BUILD_NUMBER=$((BUILD_NUMBER_OFFSET + PROJECT_BUILD_NUMBER))
          echo "Build numarası: $BUILD_NUMBER"
          # Proje "Apple Generic" sürümleme kullanmadığı için agvtool yerine
          # pbxproj'daki değeri doğrudan yazıyoruz. Sadece CI'da, geçici.
          sed -i '' "s/CURRENT_PROJECT_VERSION = .*;/CURRENT_PROJECT_VERSION = $BUILD_NUMBER;/g" \
            "$XCODE_PROJECT/project.pbxproj"

      - name: İmzalama sertifikası + profil
        script: |
          set -e
          keychain initialize
          # --create: sertifika mevcut anahtardan bulunur, YOKSA sadece profil üretilir.
          app-store-connect fetch-signing-files "$BUNDLE_ID" \
            --type IOS_APP_STORE \
            --certificate-key "@env:CERTIFICATE_PRIVATE_KEY" \
            --create
          keychain add-certificates
          xcode-project use-profiles

      - name: Swift paketlerini çöz
        script: |
          set -e
          xcodebuild -resolvePackageDependencies \
            -project "$XCODE_PROJECT" \
            -scheme "$XCODE_SCHEME"

      - name: Archive + IPA
        script: |
          set -e
          xcode-project build-ipa \
            --project "$XCODE_PROJECT" \
            --scheme "$XCODE_SCHEME"

    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log

    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: true
